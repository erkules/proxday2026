apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: mycapicluster-worker-bootstrap
spec:
  template:
    spec:
      users:
      - name: root
        sshAuthorizedKeys: ["ssh-rsa  erkan.yanar@linsenraum.de"]
      preKubeadmCommands:
      - "apt-get update"
      - "apt-get install -y qemu-guest-agent"
      - "systemctl enable --now qemu-guest-agent"
      - "sysctl -w net.ipv4.ip_forward=1"
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
          - name: provider-id
            value: "proxmox://'{{ ds.meta_data.instance_id }}'"
