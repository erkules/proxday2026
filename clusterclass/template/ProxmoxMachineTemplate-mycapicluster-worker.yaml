apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: mycapicluster-worker-machine
spec:
  template:
    spec:
      templateSelector:
        matchTags:
        - capmox
        - template
        matchPolicy: uniqueSubset
      format: "qcow2"
      full: true
      numSockets: 1
      numCores: 2
      memoryMiB: 4096
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: 20
      network:
        networkDevices:
        - bridge: vmbr0
          model: virtio
          name: net0
