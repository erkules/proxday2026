kind: ProxmoxMachineTemplate
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
metadata:
  name: "mycapicluster-control-plane"
spec:
  template:
    spec:
      sourceNode: "proxmox"
      templateID: 9000
      format: "qcow2"
      full: true
      numSockets: 1
      numCores: 2
      memoryMiB: 4096
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: 20
      network:
        networkDevices:
        - bridge: vmbr0
          model: virtio
          name: net0
