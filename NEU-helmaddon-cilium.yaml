apiVersion: addons.cluster.x-k8s.io/v1alpha1
kind: HelmChartProxy
metadata:
  name: cilium
spec:
  clusterSelector:
    matchLabels:
      cilium-helm: enabled
  repoURL: https://helm.cilium.io
  chartName: cilium
  namespace: kube-system
  releaseName: cilium
  options:
    waitForJobs: true
    wait: true
    timeout: 5m
    #install:
    #  createNamespace: true
  valuesTemplate: |
    hubble:
      relay:
        enabled: true
      ui:
        enabled: true
     
